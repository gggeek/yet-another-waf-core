# Test-env specific configuration

# NB: only set up for web/fpm environments atm, not for php-cli
# NB: keep in sync with the settings in frankenphp+caddyfile

cgi.fix_pathinfo = 1

; make all errors visible - this will make tests fail which hit a php warning server-side
display_errors = 1
error_level = -1

; all test pages should return fairly quickly. Avoid tying up resources for a long time
max_execution_time = 15

; no ouput buffering allows testing slowloris responses
output_buffering = Off
